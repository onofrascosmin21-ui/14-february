<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day 💖</title>
    <style>
        body { text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #ffe6e6; overflow: hidden; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 85%; max-width: 400px; }
        h1 { color: #ff1a75; font-size: 24px; }
        .btn-group { margin-top: 20px; position: relative; height: 60px; }
        button { padding: 15px 25px; font-size: 18px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; transition: 0.3s; }
        #yesBtn { background-color: #ff66b2; color: white; margin-right: 10px; }
        #noBtn { background-color: #ff4d4d; color: white; position: absolute; }
        #successMsg { display: none; color: #ff1a75; font-size: 30px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="content">
        <h1>Would you be my Valentine? 💖</h1>
        <div class="btn-group">
            <button id="yesBtn">YES</button>
            <button id="noBtn">NO</button>
        </div>
    </div>
    <div id="successMsg">
        Yaaay! 🥰🌹
    </div>
</div>

<form id="valentineForm" action="https://formspree.io/f/mjeypvkq" method="POST" style="display:none;">
    <input type="text" name="Raspuns" value="A SPUS DA! ❤️">
</form>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const form = document.getElementById("valentineForm");

    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
        noBtn.style.position = 'fixed';
    });

    yesBtn.addEventListener("click", function() {
        fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
        });

        document.getElementById("content").style.display = "none";
        document.getElementById("successMsg").style.display = "block";
    });
</script>

</body>
</html>
