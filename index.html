<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Day 💖</title>
  <style>
    body {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffe6e6;
      overflow: hidden;
      touch-action: manipulation; /* Îmbunătățește răspunsul la atingere pe mobil */
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      width: 85%;
      max-width: 400px;
      z-index: 10;
    }
    h1 {
      color: #ff1a75;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 40px; /* Spațiu generos între butoane */
      min-height: 60px;
      position: relative;
      align-items: center;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      min-width: 100px;
      transition: transform 0.2s;
    }
    #yesBtn {
      background-color: #ff66b2;
      color: white;
    }
    #no {
      background-color: #ff4d4d;
      color: white;
      transition: 0.1s; /* Mișcare mai fluidă */
    }
    #message {
      display: none;
      font-size: 28px;
      font-weight: bold;
      color: #ff1a75;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container" id="mainCard">
  <h1 id="question">Would you be my Valentine? 💖</h1>
  
  <div class="buttons">
    <button id="yesBtn">YES</button>
    <button id="no">NO</button>
  </div>

  <div id="message">Yaaay! Te iubesc! 🥰🌹</div>
</div>

<script>
// Webhook-ul tău de Pipedream
const webhookURL = "https://eoazijdqi67w5vu.m.pipedream.net";

async function sendClick(choice) {
  try {
    await fetch(webhookURL, {
      method: "POST",
      mode: 'no-cors',
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ choice: choice, time: new Date().toLocaleString() })
    });
  } catch (error) {
    console.log("Webhook error:", error);
  }
}

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");
const question = document.getElementById("question");

// Funcția de mișcare a butonului
function moveButton() {
  noBtn.style.position = "fixed";
  
  // Calculăm să nu iasă din ecran (scădem dimensiunea butonului + o mică marjă)
  const maxX = window.innerWidth - noBtn.offsetWidth - 20;
  const maxY = window.innerHeight - noBtn.offsetHeight - 20;
  
  const x = Math.random() * maxX;
  const y = Math.random() * maxY;
  
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// EVENIMENT PENTRU CALCULATOR (Mouse)
noBtn.addEventListener("mouseover", moveButton);

// EVENIMENT PENTRU TELEFON (Atingere)
noBtn.addEventListener("touchstart", (e) => {
  e.preventDefault(); // Previne click-ul accidental la prima atingere
  moveButton();
});

// Acțiune la YES
yesBtn.addEventListener("click", () => {
  sendClick("YES");
  document.querySelector('.buttons').style.display = 'none';
  question.style.display = 'none';
  message.style.display = "block";
  document.body.style.backgroundColor = "#ffb3d9";
});

// Dacă totuși reușește (foarte greu)
noBtn.addEventListener("click", () => {
  sendClick("NO");
  alert("Cum ai reușit?! 🤔");
});
</script>

</body>
</html>
