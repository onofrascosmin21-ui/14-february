<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Day 💖</title>
  <style>
    body { text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; background-color: #ffe6e6; overflow: hidden; }
    .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    h1 { color: #ff1a75; }
    button { padding: 12px 25px; font-size: 18px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; margin: 10px; }
    #yesBtn { background-color: #ff66b2; color: white; }
    #no { background-color: #ff4d4d; color: white; position: relative; }
  </style>
</head>
<body>

<div class="container">
  <h1 id="question">Would you be my Valentine? 💖</h1>
  <div id="btns">
    <button id="yesBtn">YES</button>
    <button id="no">NO</button>
  </div>
  <h2 id="msg" style="display:none; color: #ff1a75;">Yaaay! 🥰 Verifică e-mailul! 🌹</h2>
</div>

<form id="valentineForm" action="https://formspree.io/f/xbjnkyob" method="POST" style="display:none;">
  <input type="text" name="raspuns" value="A ZIS DA! ❤️">
</form>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yesBtn");
  const form = document.getElementById("valentineForm");

  noBtn.addEventListener("mouseover", () => {
    noBtn.style.position = "absolute";
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  });

  yesBtn.addEventListener("click", () => {
    // Trimite e-mailul automat
    form.submit(); 
    
    document.getElementById("btns").style.display = "none";
    document.getElementById("question").style.display = "none";
    document.getElementById("msg").style.display = "block";
  });
</script>
</body>
</html>
