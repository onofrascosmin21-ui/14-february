<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine's Day 💖</title>
  <style>
    body {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffe6e6;
      overflow: hidden; /* Previne scroll-ul când fuge butonul */
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    h1 {
      color: #ff1a75;
      margin-bottom: 30px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      min-height: 50px;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s;
    }
    #yesBtn {
      background-color: #ff66b2;
      color: white;
    }
    #yesBtn:hover {
      background-color: #ff3399;
      transform: scale(1.1);
    }
    #no {
      background-color: #ff4d4d;
      color: white;
      position: relative; /* Schimbat din absolute pentru layout stabil */
      z-index: 10;
    }
    #message {
      display: none;
      font-size: 24px;
      color: #ff1a75;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container" id="mainCard">
  <h1 id="question">Would you be my Valentine? 💖</h1>
  
  <div class="buttons">
    <button id="yesBtn">YES</button>
    <button id="no">NO</button>
  </div>

  <div id="message">Yaaay! Te iubesc! 🥰🌹</div>
</div>

<script>
const webhookURL = "https://eoazijdqi67w5vu.m.pipedream.net";

// Funcție pentru trimiterea datelor
async function sendClick(choice) {
  try {
    await fetch(webhookURL, {
      method: "POST",
      mode: 'no-cors', // Adăugat pentru a evita erori de tip CORS la unele webhook-uri
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ choice: choice, time: new Date().toLocaleString() })
    });
  } catch (error) {
    console.log("Webhook error:", error);
  }
}

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");
const question = document.getElementById("question");

// Logica pentru butonul care fuge
noBtn.addEventListener("mouseover", () => {
  // Schimbăm în absolute doar când începe interacțiunea
  noBtn.style.position = "absolute";
  
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
  
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

// Acțiune la YES
yesBtn.addEventListener("click", () => {
  sendClick("YES");
  
  // Ascundem butoanele și întrebarea
  document.querySelector('.buttons').style.display = 'none';
  question.style.display = 'none';
  
  // Arătăm mesajul de succes
  message.style.display = "block";
  
  // Efect de confetti opțional (doar text)
  document.body.style.backgroundColor = "#ffb3d9";
});

// Opțional: logăm și dacă reușește să dea click pe NO
noBtn.addEventListener("click", () => {
  sendClick("NO");
  alert("Cum ai reușit?! 🤔");
});
</script>

</body>
</html>
